version: '3.8'

# ==============================================================================
# Pulse Messenger — Production Multi-Container Orchestration
# Includes: Pulse Application, Nginx Reverse Proxy, PostgreSQL 16 & Redis 7
# Auto-restart policy: "unless-stopped" (recovers automatically from crashes/reboots)
# ==============================================================================

services:
  # 1. Pulse Real-Time Messenger App Server
  pulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - CLUSTER_PORT=6380
      - CLUSTER_HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pulse_admin}:${POSTGRES_PASSWORD:-pulse_secure_password_2026}@pulse-postgres:5432/${POSTGRES_DB:-pulse_chat}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-pulse_redis_secret}@pulse-redis:6379
    volumes:
      - pulse_data:/app/data
      - pulse_uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      pulse-postgres:
        condition: service_healthy
      pulse-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - pulse_network
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'

  # 2. PostgreSQL 16 Enterprise Database
  pulse-postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-pulse_chat}
    volumes:
      - pulse_postgres_data:/var/lib/postgresql/data
      - ./server/services/pgSchema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_admin} -d ${POSTGRES_DB:-pulse_chat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pulse_network
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. Redis 7 High-Throughput Pub/Sub & Caching Engine
  pulse-redis:
    image: redis:7-alpine
    container_name: pulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-pulse_redis_secret}"]
    volumes:
      - pulse_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pulse_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pulse_network
    deploy:
      resources:
        limits:
          memory: 256M

  # 4. Nginx Reverse Proxy & SSL Gateway
  pulse-nginx:
    image: nginx:alpine
    container_name: pulse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - pulse_certbot_conf:/etc/letsencrypt
      - pulse_certbot_www:/var/www/certbot
    depends_on:
      pulse-app:
        condition: service_healthy
    networks:
      - pulse_network

# Persistent Storage Volumes
volumes:
  pulse_data:
    driver: local
  pulse_uploads:
    driver: local
  pulse_postgres_data:
    driver: local
  pulse_redis_data:
    driver: local
  pulse_certbot_conf:
    driver: local
  pulse_certbot_www:
    driver: local

# Internal Isolated Network
networks:
  pulse_network:
    driver: bridge
